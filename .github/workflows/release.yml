# Релиз: по тегу vX.Y.Z собирает Linux (tar.gz), Windows (zip с .exe) и Android (APK) и публикует GitHub Release.
#   git tag v0.5.0 && git push origin v0.5.0
# Запуск вручную (Actions → release → Run workflow) — только сборка: файлы в артефактах прогона, без релиза.
# Бинарники в git не кладутся. Каждая сборка — отдельная задача: отказ одной (например, Windows) не мешает остальным.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  LIBOPUS_STATIC: "1"   # libopus — внутрь бинарника, без зависимости от системной библиотеки

jobs:
  linux:
    runs-on: ubuntu-22.04   # glibc постарше — бинарники запускаются на большем числе дистрибутивов
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Системные библиотеки (звук, хранилище секретов)
        run: sudo apt-get update && sudo apt-get install -y pkg-config cmake libasound2-dev libdbus-1-dev
      - name: Сборка
        run: |
          cargo build --release --bins
          cargo build --release -p p2p-desktop
      - name: Архив
        run: |
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          D=p2p-overlay-$V-linux-x86_64
          mkdir -p dist $D/config
          cp target/release/p2p-node target/release/p2p-orchestrator target/release/p2p-desktop $D/
          cp config/node_config.yaml $D/config/
          cp README.md USERGUIDE.md CHANGELOG.md $D/
          tar czf dist/$D.tar.gz $D
      - uses: actions/upload-artifact@v5
        with: { name: dist-linux, path: dist/* }

  windows:
    runs-on: windows-latest
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Сборка
        run: |
          cargo build --release --bins
          cargo build --release -p p2p-desktop
      - name: Архив
        run: |
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          D=p2p-overlay-$V-windows-x86_64
          mkdir -p dist $D/config
          cp target/release/p2p-node.exe target/release/p2p-orchestrator.exe target/release/p2p-desktop.exe $D/
          cp config/node_config.yaml $D/config/
          cp README.md USERGUIDE.md CHANGELOG.md $D/
          7z a dist/$D.zip $D
      - uses: actions/upload-artifact@v5
        with: { name: dist-windows, path: dist/* }

  android:
    runs-on: ubuntu-24.04
    env:
      # Ключ подписи (Settings → Secrets → Actions). Без них APK подписан временным debug-ключом раннера:
      # ставится, но следующая версия не встанет поверх — только удаление и установка заново.
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-linux-android,x86_64-linux-android" }
      - uses: Swatinem/rust-cache@v2
      - name: Android SDK и NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;36.1.0 ndk;29.0.14206865"
      - name: Узел под Android
        run: ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865 android/build_node.sh release
      - name: Ключ подписи
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 -d > android/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=p2p-overlay\nkeyPassword=%s\n' \
            "$KS_PASSWORD" "$KS_PASSWORD" > android/keystore.properties
      - name: APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      - name: Имена файлов
        run: |
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          mkdir -p dist
          for abi in arm64-v8a x86_64 universal; do
            cp android/app/build/outputs/apk/release/app-$abi-release.apk dist/p2p-overlay-$V-android-$abi.apk
          done
      - uses: actions/upload-artifact@v5
        with: { name: dist-android, path: dist/* }

  release:
    needs: [linux, windows, android]
    # публикуем то, что собралось, даже если одна из сборок упала
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v5
        with: { pattern: "dist-*", merge-multiple: true, path: dist }
      - name: Контрольные суммы
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
