# Сборка и тесты: узел (Rust) + Android-приложение. Узел кросс-компилируется под Android и кладётся в APK.
# Инструментальные тесты (эмулятор) из CI убраны: на раннере GitHub стабильно падали при зелёном локальном прогоне;
# запускаются локально — cd android && ./gradlew connectedDebugAndroidTest.
name: android

on:
  push:
    paths: ["src/**", "android/**", "Cargo.toml", ".github/workflows/android.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }

      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-linux-android,x86_64-linux-android" }

      - uses: Swatinem/rust-cache@v2

      - name: Тесты узла
        run: cargo test

      - name: Android SDK и NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;36.1.0 ndk;29.0.14206865"

      - name: Узел под Android
        run: ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865 android/build_node.sh release

      - name: APK и JVM-тесты
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest

      - uses: actions/upload-artifact@v5
        with:
          name: apk
          path: android/app/build/outputs/apk/debug/*.apk
