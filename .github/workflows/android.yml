# Сборка и тесты: узел (Rust) + Android-приложение. Узел кросс-компилируется под Android
# и кладётся в APK; инструментальные тесты — в эмуляторе (x86_64, KVM на раннере ubuntu).
name: android

on:
  push:
    paths: ["src/**", "android/**", "Cargo.toml", ".github/workflows/android.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }

      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-linux-android,x86_64-linux-android" }

      - uses: Swatinem/rust-cache@v2

      - name: Тесты узла
        run: cargo test

      - name: Android SDK и NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;36.1.0 ndk;29.0.14206865"

      - name: Узел под Android
        run: ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865 android/build_node.sh release

      - name: APK и JVM-тесты
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: KVM для эмулятора
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      # Раннер медленнее локального эмулятора: больше памяти и ядер, без камеры и снимков; при отказе — logcat
      # и отчёты тестов в артефакт (лог шага без входа в GitHub не прочитать, отчёт — скачать).
      - name: Инструментальные тесты (эмулятор)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          cores: 4
          ram-size: 4096M
          disk-size: 6000M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          script: cd android && ./gradlew --no-daemon connectedDebugAndroidTest || (adb logcat -d > ../logcat.txt; exit 1)

      - name: Отчёт инструментальных тестов
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            logcat.txt
          if-no-files-found: ignore
