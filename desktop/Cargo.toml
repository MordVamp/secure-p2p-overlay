[package]
name = "p2p-desktop"
version = "0.1.0"
edition = "2021"
description = "[Coursework] Desktop-клиент P2P-оверлея: чаты, контакты, сеть, журнал. Работает через локальный HTTP API узла."

[dependencies]
eframe     = "0.31"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "p2p-desktop"
path = "src/main.rs"
