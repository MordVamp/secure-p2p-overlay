[package]
name = "p2p-desktop"
version = "0.1.0"
edition = "2021"
description = "[Coursework] Desktop-клиент P2P-оверлея: чаты, контакты, сеть, журнал. Работает через локальный HTTP API узла."

[dependencies]
eframe     = "0.31"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode     = { version = "0.14", default-features = false }
# звук звонка: микрофон и динамик (ALSA / PulseAudio / PipeWire через ALSA, WASAPI, CoreAudio)
cpal       = "0.15"

[[bin]]
name = "p2p-desktop"
path = "src/main.rs"
